<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 | Random Quote Generator using Fetch API</title>
</head>

<body>

    <h1>Random Quote Generator</h1>
    <ul>
        <li>Ek button hoga: "Show Me a Quote 🧠"</li>
        <li>Jab click kare:</li>
        <li>API call ho (https://api.quotable.io/random)</li>
        <li>Quote and Author DOM mein dikh jaaye</li>
    </ul>
    <br><br>

    <p id="getQuoate"></p>
    <p id="getAuthor"> <b></b> </p>
    <button id="quoateBtn"> Show Me a Quote </button>

</body>

<script>

    const qoute = document.getElementById("getQuoate");
    const author = document.getElementById("getAuthor");
    const btn = document.getElementById("quoateBtn");


    btn.addEventListener("click", async () => {
        try {
            btn.innerHTML = "Loading.....!!!";
            const response = await fetch("https://dummyjson.com/quotes/random");
            const data = await response.json();
            console.log(data);
            const id = data.id
            qoute.innerHTML = `"${data.quote}"`;
            author.innerHTML = `<b>${data.author}</b> <br> ID : ${id}`;
            btn.innerHTML = "Show Me a Quote";
        } catch (error) {
            quote.innerHTML = "Something Went Wrong....";
            author.innerHTML = "";
            btn.innerHTML = "Try Again";
            console.log('Error:', error);

        }
    })

</script>

</html>
