    // Async Await Real-Life Example

    function orderPizza() {
      return new Promise((reslove, reject) => {
        const delivered = true;

        setTimeout(() => {
          if (delivered) {
            reslove("Pizza agya Ustad.... :) ");
          } else {
            reject("Pizza Shatt hai Ustad.. :( ");
          }
        }, 2000);
      });
    }

    async function getPizza() {
      try {
        console.log("Pizza Order Kia......");
        const pizza = await orderPizza();
        console.log("Delivered:", pizza);
      } catch (error) {
        console.log("Error:", error);
      }
    }

    getPizza();
  </script>
